name: Android APK

on:
  push:
    branches: ["arena/e7ce116f-britech"]
  workflow_dispatch:

permissions:
  contents: write


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install platform and build tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Run unit tests
        run: |
          gradle --no-daemon testDebugUnitTest --stacktrace > gradle-test.log 2>&1 || {
            { grep -E '^(e:|w:|FAILURE:|Execution failed|.*\.kt:.*error:|.*What went wrong:)' gradle-test.log || true; head -n 25 gradle-test.log; } | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - name: Preserve Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-diagnostics
          path: gradle-test.log
          if-no-files-found: ignore
      - name: Build debug and release APKs
        run: gradle --no-daemon assembleDebug assembleRelease
      - name: Verify release APK signature
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify app/build/outputs/apk/release/app-release.apk
      - name: Verify APK outputs
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/{debug,release}/*.apk
      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dayflow-planner-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
      - name: Publish APKs as GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NO: ${{ github.run_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          TAG="dayflow-build-${RUN_NO}"
          gh release create "$TAG" \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/release/app-release.apk \
            --repo "$REPOSITORY" \
            --title "DayFlow Planner build ${RUN_NO}" \
            --notes "Automated Android build from commit ${GITHUB_SHA}. Both APKs are signed with the standard Android debug key for convenient sideload installation. This key is not suitable for Play Store publication." \
            --prerelease
